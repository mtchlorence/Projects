name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    # Set working directory to where your code lives
    defaults:
      run:
        working-directory: Cloud_Engineering/resume_analyzer_monitoring

    steps:
      - uses: actions/checkout@v4
      
      - name: Debug - List files
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          echo "Contents of app/:"
          ls -la app/ || echo "app/ not found"
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8
      
      - name: Lint with flake8
        run: flake8 app/app.py app/analyzer.py --count --max-complexity=10 --statistics || echo "No flake8 issues"
      
      - name: Run tests
        run: pytest tests/ || echo "No tests yet"
      
      - name: Build Docker image
        run: docker build -t resume-analyzer .
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Push to Docker Hub
        run: |
          docker tag resume-analyzer ${{ secrets.DOCKER_USERNAME }}/resume-analyzer:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/resume-analyzer:latest