services:
  prometheus:
    image: prom/prometheus
    container_name: resume-analyzer-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: resume-analyzer-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus