services:
  prometheus:
    image: prom/prometheus
    container_name: job-curator-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: job-curator-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
 
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-curator-app
    env_file:
      - path: .env
        required: false
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
