<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midterm Activity 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html {
            background-color: #EDE7DC;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 20px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #input-container {
            text-align: center;
            background-color: #BDC3CB;
            padding: 30px;
            border-radius: 10px;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: inline-block;
            width: 150px;
            text-align: right;
            margin-right: 10px;
        }

        .input-group input[type="number"] {
            padding: 8px;
            width: 200px;
            background-color: #DCD2CC;
            border-radius: 10px;
        }

        .input-group input[type="number"]::placeholder {
            font-family: 'Poppins', sans-serif;
        }

        button {
            font-family: 'Poppins', sans-serif;
            padding: 8px 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 30px;
        }

        #output {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>Sort Numbers</h1>
    <div id="input-container">
        <div class="input-group">
            <label for="num1">First number:</label>
            <input type="number" id="num1" placeholder="Enter first number">
        </div>
        <div class="input-group">
            <label for="num2">Second number:</label>
            <input type="number" id="num2" placeholder="Enter second number">
        </div>
        <div class="input-group">
            <label for="num3">Third number:</label>
            <input type="number" id="num3" placeholder="Enter third number">
        </div>
        <button onclick="sortNumbers()">Sort</button>
        <button onclick="clearAll()">Clear</button>
        <div id="output"></div>
    </div>

    <script>
        function sortNumbers() {
            // Get the input values
            var num1 = parseFloat(document.getElementById("num1").value);
            var num2 = parseFloat(document.getElementById("num2").value);
            var num3 = parseFloat(document.getElementById("num3").value);

            // Put the numbers into an array
            var numbers = [num1, num2, num3];

            // Sort the numbers
            numbers.sort(function (a, b) {
                return a - b;
            });

            // Output the sorted numbers
            var outputDiv = document.getElementById("output");
            outputDiv.innerHTML = "Numbers in ascending order: " + numbers.join(", ");
        }

        function clearAll() {
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("num3").value = "";
            document.getElementById("output").innerHTML = "";
        }
    </script>
</body>

</html>
