<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <title>Midterm Activity 3</title>
    <style>
        html {
            background-color: #efe0c4;
        }

        h1 {
            position: relative;
            text-align: center;
            margin: 20px;
        }

        h2 {
            text-align: center;
            color: white;
            padding-right: 15px;
        }

        h3 {
            text-align: center;
            color: rgb(44, 42, 61);
            padding-right: 15px;
        } 

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #input-container {
            text-align: center;
            background-color: #9bb4d4;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: right;
            align-items: center;
            margin: 10px;
        }

        #input-container input[type="number"] {
            padding: 8px;
            width: 50px;
            background-color: #eaded8;
            border-radius: 10px;
        }

        button {
                font-family: 'Poppins', sans-serif;
                padding: 5px;
                margin: auto;
                cursor: pointer;
                border-radius: 100px;
                width: 100px;
                display: inline-block;
                margin-left: auto;
                margin-right: auto;
        }

        #output-container {
            text-align: center;       
        }
    </style>
</head>

<body>
    <h1>House Models </h1>
    <div>
        <div id="input-container">
            <h2>Colonial</h2>
            <div>
                <label for="basePrice">Base Price:</label>
                <input type="number" id="model1-base">
                <label for="finishedArea">Area:</label>
                <input type="number" id="model1-area">
            </div>
        </div>

        <div id="input-container">
            <h2>Split Entry</h2>
            <div>
                <label for="basePrice">Base Price:</label>
                <input type="number" id="model2-base">
                <label for="finishedArea">Area:</label>
                <input type="number" id="model2-area">
            </div>
        </div>

        <div id="input-container">
            <h2>Single-story</h2>
            <div>
                <label for="basePrice">Base Price:</label>
                <input type="number" id="model3-base">
                <label for="finishedArea">Area:</label>
                <input type="number" id="model3-area">
            </div>
        </div>
        <button onclick="computeLeastPrice()">Compute</button>
        <button onclick="clearAll()">Clear</button>
       
        <div id="output-container">
            <h3>Model(s) with the least price per square foot</h3>
            <p id="output"></p>
        </div>
    </div>   
    <script>
        function computeLeastPrice() {
            // Get the input values
            var model1Base = parseFloat(document.getElementById('model1-base').value);
            var model2Base = parseFloat(document.getElementById('model2-base').value);
            var model3Base = parseFloat(document.getElementById('model3-base').value);
            var model1Area = parseFloat(document.getElementById('model1-area').value);
            var model2Area= parseFloat(document.getElementById('model2-area').value);
            var model3Area = parseFloat(document.getElementById('model3-area').value);

            // Calculate the price per square foot for each model
            var model1PricePerSqft = model1Base / model1Area;
            var model2PricePerSqft = model2Base / model2Area;
            var model3PricePerSqft = model3Base / model3Area;

            // Find the model(s) with the least price per square foot
            var leastPricePerSqft = Math.min(model1PricePerSqft, model2PricePerSqft, model3PricePerSqft);
            var leastPriceModels = [];

            if (leastPricePerSqft === model1PricePerSqft) {
                leastPriceModels.push("Colonial");
            }
            if (leastPricePerSqft === model2PricePerSqft) {
                leastPriceModels.push("Split Entry");
            }
            if (leastPricePerSqft === model3PricePerSqft) {
                leastPriceModels.push("Single-story");
            }

            // Output the model(s) with the least price per square foot
            var output = leastPriceModels.join(", ") +": " + leastPricePerSqft.toFixed(2);
            var outputElement = document.createElement('p');
            outputElement.textContent = output;
            document.getElementById('output-container').appendChild(outputElement);
        }

        function clearAll() {
            document.getElementById('model1-base').value = '';
            document.getElementById('model2-base').value = '';
            document.getElementById('model3-base').value = '';
            document.getElementById('model1-area').value = '';
            document.getElementById('model2-area').value = '';
            document.getElementById('model3-area').value = '';
            document.getElementById('output').textContent = '';

        }
    </script>
</body>

</html>
