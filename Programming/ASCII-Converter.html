<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midterm Activity 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html {
            background-color: #efe0c4;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 20px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #input-container {
            text-align: center;
            background-color: #9bb4d4;
            padding: 30px;
            border-radius: 10px;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: inline-block;
            width: 150px;
            text-align: right;
            margin-right: 10px;
        }

        .input-group input[type="number"] {
            padding: 8px;
            width: 200px;
            background-color: #eaded8;
            border-radius: 10px;
        }

        .input-group input[type="number"]::placeholder {
            font-family: 'Poppins', sans-serif;
        }

        button {
            font-family: 'Poppins', sans-serif;
            padding: 8px 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 30px;
        }

        #output {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>Number to ASCII</h1>
    <div id="input-container">
        <div class="input-group">
            <label for="input">Enter a number:</label>
            <input type="number" id="input" placeholder="Enter a number from 0-35.">
        </div>
        
        <button onclick="generateOutput()">Output</button>
        <button onclick="clearAll()">Clear</button>
        <div id="output"></div>
    </div>

    <script>
        function generateOutput() {
                const input = parseInt(document.getElementById('input').value);
                const output = document.getElementById('output');
                const inputContainer = document.getElementById('input-container');

                if (input <= 35 && input >= 0) {
                    if (input <= 9) {
                        output.innerHTML = `Output: ${input}`;
                    } else {
                        let convertInput = String.fromCharCode(input + 65 - 10);
                        output.innerHTML = `Output: ${convertInput}`;
                    }

                } else {
                    alert("Please enter a number between 0 and 35.");
                    output.innerHTML = "";
                }
            }

        function clearAll() {
            document.getElementById("input").value = "";
            document.getElementById("output").innerHTML = "";
        }
    </script>
</body>

</html>
